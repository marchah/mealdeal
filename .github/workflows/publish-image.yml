# Build the container image and publish it to GitHub Container Registry.
#
# The `docker` job in ci.yml validates that the Dockerfile still builds on every PR
# (push: false). This workflow is the one that actually publishes, and only for commits that
# have landed: pushes to main and version tags.
#
# Consumers pull a tag instead of building from source — for the homelab that means the
# Portainer compose stack goes from a multi-minute rebuild per update to a ~10 s pull, and
# rollback becomes "pin the previous sha- tag".
#
# ⚠️ FIRST PUBLISH IS PRIVATE. GitHub creates the package private by default, so an
# unauthenticated `docker pull` will 401. After the first successful run, go to
#   github.com/marchah?tab=packages -> mealdeal -> Package settings
# and either set the visibility to Public, or leave it private and give the puller
# (Portainer) a read:packages token. Public is simpler for a public MIT repo.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never let two publishes for the same ref race to the same tag.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Buildx enables the GitHub Actions layer cache below, which matters here: the image
      # builds the SPA and the API, so an uncached build is slow.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `main` is the moving tag a deployment follows; `sha-<short>` is the immutable one to
          # pin for a rollback; semver tags come from `v*` releases.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
