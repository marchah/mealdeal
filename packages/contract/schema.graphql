type AppConfig {
  couponIngestEnabled: Boolean!
  lastIngestAt: DateTime
}

type ConflictError {
  message: String!
  status: Int!
}

type CouponType {
  createdAt: DateTime!
  id: ID!
  key: String!
  label: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Deal {
  category: String
  code: String
  couponType: CouponType
  couponTypeId: ID
  createdAt: DateTime!
  currency: String
  discountPct: Float
  discountText: String
  expiresAt: DateTime
  id: ID!
  item: String
  merchant: Merchant!
  price: Float
  startsAt: DateTime
  title: String!
  url: String
}

type LocationLookupError {
  message: String!
  status: Int!
}

type LocationNotConfiguredError {
  message: String!
  status: Int!
}

type LocationNotFoundError {
  message: String!
  status: Int!
}

type Merchant {
  address: String
  createdAt: DateTime!
  id: ID!
  lat: Float
  lng: Float
  name: String!
}

type Mutation {
  addNewsletter(merchantId: ID!, name: String!, recommended: Boolean = false, signupUrl: String!): MutationAddNewsletterResult!
  addPantryItem(input: PantryItemInput!): MutationAddPantryItemResult!
  addPref(kind: PrefKind!, scope: PrefScope!, value: String!): TrackingPref!
  addPriceEntry(input: PriceEntryInput!): MutationAddPriceEntryResult!
  archivePantryItem(archived: Boolean = true, id: ID!): MutationArchivePantryItemResult!
  deletePantryItem(id: ID!): MutationDeletePantryItemResult!
  deletePriceEntry(id: ID!): MutationDeletePriceEntryResult!
  removeNewsletter(id: ID!): MutationRemoveNewsletterResult!
  removePref(id: ID!): Boolean!
  updatePantryItem(id: ID!, input: PantryItemInput!): MutationUpdatePantryItemResult!
}

union MutationAddNewsletterResult = MutationAddNewsletterSuccess | NotFoundError | ServerError | ValidationError

type MutationAddNewsletterSuccess {
  data: Newsletter!
}

union MutationAddPantryItemResult = ConflictError | MutationAddPantryItemSuccess | NotFoundError | ServerError | ValidationError

type MutationAddPantryItemSuccess {
  data: PantryItem!
}

union MutationAddPriceEntryResult = ConflictError | MutationAddPriceEntrySuccess | NotFoundError | ServerError | ValidationError

type MutationAddPriceEntrySuccess {
  data: PriceEntry!
}

union MutationArchivePantryItemResult = MutationArchivePantryItemSuccess | NotFoundError | ServerError

type MutationArchivePantryItemSuccess {
  data: PantryItem!
}

union MutationDeletePantryItemResult = MutationDeletePantryItemSuccess | NotFoundError | ServerError

type MutationDeletePantryItemSuccess {
  data: PantryItem!
}

union MutationDeletePriceEntryResult = MutationDeletePriceEntrySuccess | NotFoundError | ServerError

type MutationDeletePriceEntrySuccess {
  data: PriceEntry!
}

union MutationRemoveNewsletterResult = MutationRemoveNewsletterSuccess | NotFoundError | ServerError

type MutationRemoveNewsletterSuccess {
  data: Newsletter!
}

union MutationUpdatePantryItemResult = ConflictError | MutationUpdatePantryItemSuccess | NotFoundError | ServerError | ValidationError

type MutationUpdatePantryItemSuccess {
  data: PantryItem!
}

type NearbyDealGroup {
  couponType: CouponType
  deals: [Deal!]!
}

type Newsletter {
  id: ID!
  merchantId: ID!
  name: String!
  recommended: Boolean!
  signupUrl: String!
}

type NotFoundError {
  message: String!
  status: Int!
}

type PantryItem {
  archived: Boolean!
  brand: String
  category: CouponType
  couponTypeId: ID
  createdAt: DateTime!
  id: ID!
  imageUrl: String
  insight(windowDays: Int = 365): PriceInsight!
  name: String!
  notes: String
  priceEntries(limit: Int, since: DateTime): [PriceEntry!]!
  sizeAmount: Float
  sizeUnit: Unit
  targetPrice: Float
  unitPriceUnit: Unit!
}

input PantryItemInput {
  brand: String
  couponTypeId: ID
  imageUrl: String
  name: String!
  notes: String
  sizeAmount: Float
  sizeUnit: Unit
  targetPrice: Float
  unitPriceUnit: Unit!
}

enum PrefKind {
  MUTE
  WATCHLIST
}

enum PrefScope {
  CATEGORY
  ITEM
}

type PriceEntry {
  createdAt: DateTime!
  currency: String!
  id: ID!
  merchant: Merchant
  note: String
  observedAt: DateTime!
  onSale: Boolean!
  pantryItemId: ID!
  price: Float!
  quantity: Float!
  sizeAmount: Float!
  sizeUnit: Unit!
  source: PriceSource!
  unitPrice: Float!
  url: String
}

input PriceEntryInput {
  currency: String
  merchantName: String
  note: String
  observedAt: DateTime
  onSale: Boolean
  pantryItemId: ID!
  price: Float!
  quantity: Float
  sizeAmount: Float!
  sizeUnit: Unit!
  source: PriceSource
  url: String
}

type PriceInsight {
  cheapestMerchant: Merchant
  currency: String
  displayUnit: Unit!
  formattedLatestUnitPrice: String
  highestUnitPrice: Float
  latest: PriceEntry
  latestUnitPrice: Float
  lowestUnitPrice: Float
  medianUnitPrice: Float
  meetsTargetPrice: Boolean
  observationCount: Int!
  pantryItemId: ID!
  percentile: Float
  savingsVsMedianPct: Float
  verdict: PriceVerdict!
  windowDays: Int!
}

enum PriceSource {
  COUPON
  IMPORT
  MANUAL
}

enum PriceVerdict {
  GOOD
  GREAT
  HIGH
  TYPICAL
  UNKNOWN
}

type Query {
  appConfig: AppConfig!
  deal(id: ID!): QueryDealResult!
  deals(activeOnly: Boolean = true, category: String): [Deal!]!
  dealsNearMe(radiusMiles: Float = 25): QueryDealsNearMeResult!
  getCouponTypes: [CouponType!]!
  newsletter(id: ID!): QueryNewsletterResult!
  pantryItem(id: ID!): QueryPantryItemResult!
  pantryItems(couponTypeId: ID, includeArchived: Boolean = false): [PantryItem!]!
  prefs: [TrackingPref!]!
  recommendedNewsletters(radiusMiles: Float = 25): QueryRecommendedNewslettersResult!
  stats: Stats!
  storesNearLocation(lat: Float!, lng: Float!, radiusMiles: Float!): QueryStoresNearLocationResult!
  storesNearMe(radiusMiles: Float = 25): QueryStoresNearMeResult!
}

union QueryDealResult = NotFoundError | QueryDealSuccess | ServerError

type QueryDealSuccess {
  data: Deal!
}

union QueryDealsNearMeResult = LocationLookupError | LocationNotConfiguredError | LocationNotFoundError | QueryDealsNearMeSuccess | ServerError | ValidationError

type QueryDealsNearMeSuccess {
  data: [NearbyDealGroup!]!
}

union QueryNewsletterResult = NotFoundError | QueryNewsletterSuccess | ServerError

type QueryNewsletterSuccess {
  data: Newsletter!
}

union QueryPantryItemResult = NotFoundError | QueryPantryItemSuccess | ServerError

type QueryPantryItemSuccess {
  data: PantryItem!
}

union QueryRecommendedNewslettersResult = LocationLookupError | LocationNotConfiguredError | LocationNotFoundError | QueryRecommendedNewslettersSuccess | ServerError | ValidationError

type QueryRecommendedNewslettersSuccess {
  data: [Newsletter!]!
}

union QueryStoresNearLocationResult = QueryStoresNearLocationSuccess | ServerError | ValidationError

type QueryStoresNearLocationSuccess {
  data: [Store!]!
}

union QueryStoresNearMeResult = LocationLookupError | LocationNotConfiguredError | LocationNotFoundError | QueryStoresNearMeSuccess | ServerError | ValidationError

type QueryStoresNearMeSuccess {
  data: [Store!]!
}

type ServerError {
  message: String!
  status: Int!
}

type Stats {
  activeDeals: Int!
  itemsWorthBuyingNow: Int!
  lastIngestAt: DateTime
  merchants: Int!
  pantryItems: Int!
  totalDeals: Int!
}

type Store {
  address: String
  distanceMiles: Float!
  id: ID!
  lat: Float!
  lng: Float!
  name: String!
}

type TrackingPref {
  createdAt: DateTime!
  id: ID!
  kind: PrefKind!
  scope: PrefScope!
  value: String!
}

enum Unit {
  COUNT
  FLUID_OUNCE
  GALLON
  OUNCE
  PINT
  POUND
  QUART
  SQUARE_FOOT
}

type ValidationError {
  message: String!
  status: Int!
}
